<article class="page">
    <header class="page-head">
        <div class="page-icon"><i class="fas fa-chalkboard-user"></i></div>
        <div class="page-head-text">
            <h2>Teaching</h2>
            <p class="page-lead" id="teaching-summary">Courses taught at UPC-BarcelonaTech and UOC.</p>
        </div>
    </header>

    <div id="teaching-container"></div>
</article>

<style>
.degree-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #fafbfc;
    border-bottom: 1px solid var(--line);
}

.degree-head .row-media {
    width: 34px;
    height: 34px;
    flex-basis: 34px;
}

.degree-head .row-title {
    flex: 1;
}

.course-row {
    align-items: center;
}

.course-row .row-title {
    font-weight: 500;
}

.course-semesters {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 4px;
    max-width: 55%;
}

@media screen and (max-width: 768px) {
    .course-row {
        flex-wrap: wrap;
    }

    .course-semesters {
        max-width: none;
        width: 100%;
        justify-content: flex-start;
        padding-left: 58px;
    }
}
</style>

<script>
(function() {
    function institutionOf(degree) {
        return /uoc/i.test(degree.logo) ? 'Universitat Oberta de Catalunya' : 'Universitat Politècnica de Catalunya';
    }

    function createCourseRow(course) {
        const semesters = [...course.semesters].sort().reverse();
        return `
            <a class="row-item course-row" href="${course.url}" target="_blank" rel="noopener">
                <span class="badge code accent">${course.code}</span>
                <div class="row-body">
                    <div class="row-title">${course.name}</div>
                </div>
                <div class="course-semesters" title="Semesters taught">
                    ${semesters.map(s => `<span class="chip small">${s}</span>`).join('')}
                </div>
            </a>
        `;
    }

    function createDegreeCard(degree) {
        return `
            <div class="card">
                <div class="degree-head">
                    <div class="row-media logo"><img src="${degree.logo}" alt=""></div>
                    <div class="row-body">
                        <div class="row-title">${degree.url ? `<a href="${degree.url}" target="_blank" rel="noopener" style="color: inherit;">${degree.title}</a>` : degree.title}</div>
                        <p class="row-meta">${institutionOf(degree)}</p>
                    </div>
                </div>
                ${degree.courses.map(createCourseRow).join('')}
            </div>
        `;
    }

    fetch('data/teaching.json')
        .then(response => {
            if (!response.ok) throw new Error('Failed to load teaching data');
            return response.json();
        })
        .then(degrees => {
            const courses = degrees.reduce((n, d) => n + d.courses.length, 0);
            const years = degrees.flatMap(d => d.courses.flatMap(c => c.semesters.map(s => parseInt(s, 10))));
            document.getElementById('teaching-summary').textContent =
                `${courses} courses across ${degrees.length} degrees at UPC-BarcelonaTech and UOC, since ${Math.min(...years)}.`;
            document.getElementById('teaching-container').innerHTML = degrees.map(createDegreeCard).join('');
        })
        .catch(error => {
            console.error('Error loading teaching data:', error);
            document.getElementById('teaching-container').innerHTML = '<div class="empty">Error loading teaching information. Please try again later.</div>';
        });
})();
</script>
