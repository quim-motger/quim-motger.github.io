<article class="page">
    <header class="page-head">
        <div class="page-icon"><i class="fas fa-flask"></i></div>
        <div class="page-head-text">
            <h2>Research Projects</h2>
            <p class="page-lead">European, national (Spanish) and regional (Catalan) research projects.</p>
        </div>
    </header>

    <h3 class="section-label"><i class="fas fa-circle-play"></i>Ongoing</h3>
    <div class="grid cols-2" id="projects-current"></div>

    <h3 class="section-label"><i class="fas fa-clock-rotate-left"></i>Past</h3>
    <div class="grid cols-2" id="projects-past"></div>
</article>

<style>
.project-tile {
    flex-direction: column;
    gap: 8px;
}

.project-head {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
}

.project-head .row-media {
    width: 44px;
    height: 44px;
    flex-basis: 44px;
}

.project-head .row-body {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.project-desc {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.5;
}
</style>

<script>
(function() {
    function createProjectTile(project, ongoing) {
        return `
            <a class="tile project-tile" href="${project.url}" target="_blank" rel="noopener">
                <div class="project-head">
                    <div class="row-media logo"><img src="${project.image}" alt=""></div>
                    <div class="row-body">
                        <span class="row-title">${project.title}</span>
                        <span class="badge ${ongoing ? 'success' : ''}">${project.dateRange}</span>
                    </div>
                </div>
                <p class="project-desc">${project.description}</p>
            </a>
        `;
    }

    fetch('data/projects.json')
        .then(response => {
            if (!response.ok) throw new Error('Failed to load projects data');
            return response.json();
        })
        .then(projects => {
            const currentYear = new Date().getFullYear();
            const isOngoing = p => parseInt(p.dateRange.split('-').pop(), 10) >= currentYear;
            document.getElementById('projects-current').innerHTML =
                projects.filter(isOngoing).map(p => createProjectTile(p, true)).join('') ||
                '<div class="empty">No ongoing projects.</div>';
            document.getElementById('projects-past').innerHTML =
                projects.filter(p => !isOngoing(p)).map(p => createProjectTile(p, false)).join('');
        })
        .catch(error => {
            console.error('Error loading projects:', error);
            document.getElementById('projects-current').innerHTML = '<div class="empty">Error loading projects. Please try again later.</div>';
        });
})();
</script>
