<article class="wrapper style2">
    <div class="container">
        <header style="text-align: left;">
            <h2>Service</h2>
            <p style="margin-top: 0.6em; color: #666;">Community and academic service activities.</p>
        </header>
        <div id="service-sections"></div>
    </div>
</article>

<script>
    function renderServiceSection(title, icon, itemsHtml) {
        const count = (itemsHtml.match(/<li>/g) || []).length;
        return `
            <details class="service-section">
                <summary>
                    <i class="fas ${icon} service-icon"></i>
                    <span class="service-title">${title}</span>
                    <span class="service-count">${count}</span>
                    <i class="fas fa-chevron-down service-chevron"></i>
                </summary>
                <ul>
                    ${itemsHtml}
                </ul>
            </details>
        `;
    }

    function renderServiceData(data) {
        const container = document.getElementById('service-sections');
        if (!container) return;

        const getSortYear = (item) => {
            if (typeof item.year === 'number') return item.year;
            if (typeof item.year === 'string') {
                const parsed = parseInt(item.year, 10);
                if (!Number.isNaN(parsed)) return parsed;
            }
            const match = (item.event || '').match(/\b(19|20)\d{2}\b/g);
            return match ? parseInt(match[match.length - 1], 10) : 0;
        };

        const ocItems = [...data.organizingCommittee]
            .sort((a, b) => {
                const yearDiff = getSortYear(b) - getSortYear(a);
                if (yearDiff !== 0) return yearDiff;
                return (a.event || '').localeCompare(b.event || '');
            })
            .map(item => `<li>${item.role_html}. ${item.event}.</li>`)
            .join('');

        const phdStudentItems = (data.phdStudents || [])
            .map(item => {
                const institution = item.institution ? ` (${item.institution})` : '';
                const programName = item.program_url
                    ? `<a href="${item.program_url}" target="_blank" rel="noopener">${item.program}</a>`
                    : item.program;
                const program = item.program ? ` - ${programName}` : '';
                const linkedin = item.url
                    ? ` <a href="${item.url}" target="_blank" rel="noopener" class="service-linkedin" title="LinkedIn" aria-label="${item.name} on LinkedIn"><i class="fab fa-linkedin"></i></a>`
                    : '';
                return `<li><strong>${item.name}</strong>${institution}${program}.${linkedin}</li>`;
            })
            .join('');

        const studentItems = data.students
            .map(item => {
                const institution = item.institution ? ` (${item.institution})` : '';
                return `<li><strong>${item.name}</strong>${institution} - Academic course: ${item.academic_course} - ${item.type} - ${item.supervision}.</li>`;
            })
            .join('');

        const conferenceWorkshopItems = [...(data.conferenceWorkshopService || [])]
            .sort((a, b) => {
                const yearA = typeof a.year === 'number' ? a.year : 0;
                const yearB = typeof b.year === 'number' ? b.year : 0;
                if (yearB !== yearA) return yearB - yearA;
                return `${a.name} ${a.acronym}`.localeCompare(`${b.name} ${b.acronym}`);
            })
            .map(item => {
                const tracks = (item.tracks || []).join('; ');
                const roles = (item.roles || []).join(', ');
                return `<li>${item.name} (${item.acronym}), ${item.year}. Roles: ${roles}.${tracks ? ` Tracks: ${tracks}.` : ''}</li>`;
            })
            .join('');

        const journalItems = (data.journalEditorialRoles || [])
            .map(item => `<li>${item.role_html}. ${item.journal}.</li>`)
            .concat(data.reviewerJournals.map(item => `<li><strong>Reviewer</strong>. ${item}.</li>`))
            .join('');

        container.innerHTML = [
            renderServiceSection('Organizing Committee Membership', 'fa-sitemap', ocItems),
            renderServiceSection('Program Committee and Reviewer - Conferences and Workshops', 'fa-clipboard-check', conferenceWorkshopItems),
            renderServiceSection('Editorial Service and Reviewer - Journals', 'fa-newspaper', journalItems),
            renderServiceSection('PhD Students', 'fa-user-graduate', phdStudentItems),
            renderServiceSection('Undergraduate Students', 'fa-graduation-cap', studentItems),
        ].join('');
    }

    async function loadServiceData() {
        const container = document.getElementById('service-sections');
        try {
            const response = await fetch(`../data/service.json?v=${Date.now()}`, { cache: 'no-store' });
            if (!response.ok) {
                throw new Error('Failed to load service data');
            }

            const data = await response.json();
            renderServiceData(data);
        } catch (error) {
            console.error('Error loading service data:', error);
            if (container) {
                container.innerHTML = '<p style="color: red; padding: 1em 0;">Error loading service data. Please try again later.</p>';
            }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadServiceData);
    } else {
        loadServiceData();
    }
</script>

<style>
    .service-section {
        background: #fff;
        border: 1px solid rgba(58, 110, 165, 0.15);
        border-radius: 10px;
        padding: 1em 1.4em;
        margin: 0 0 1em 0;
        text-align: left;
    }

    .service-linkedin {
        color: #0a66c2;
        border-bottom: none;
        text-decoration: none;
        margin-left: 0.2em;
    }

    .service-linkedin:hover {
        opacity: 0.75;
    }

    .service-section summary {
        display: flex;
        align-items: center;
        gap: 0.8em;
        cursor: pointer;
        list-style: none;
        user-select: none;
    }

    .service-section summary::-webkit-details-marker {
        display: none;
    }

    .service-icon {
        width: 2.2em;
        height: 2.2em;
        flex: 0 0 2.2em;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(58, 110, 165, 0.1);
        color: #3a6ea5;
        font-size: 1em;
    }

    .service-title {
        flex: 1;
        color: #3a6ea5;
        font-weight: bold;
        font-size: 1.1em;
        line-height: 1.3;
    }

    .service-count {
        min-width: 1.8em;
        padding: 0.1em 0.6em;
        border-radius: 1em;
        background: #f0f3f7;
        color: #666;
        font-size: 0.85em;
        text-align: center;
    }

    .service-chevron {
        color: #999;
        transition: transform 0.25s ease;
    }

    .service-section[open] .service-chevron {
        transform: rotate(180deg);
    }

    .service-section summary:hover .service-title {
        text-decoration: underline;
    }

    .service-section[open] summary {
        border-bottom: 1px solid #e5e5e5;
        padding-bottom: 0.8em;
        margin-bottom: 0.8em;
    }

    .service-section ul {
        margin: 0;
        padding-left: 1.2em;
        text-align: left;
    }

    .service-section li {
        color: #333;
        line-height: 1.45;
        margin-bottom: 0.3em;
        text-align: left;
    }

    @media screen and (max-width: 768px) {
        .service-section {
            margin-left: 8px;
            margin-right: 8px;
        }
    }
</style>
