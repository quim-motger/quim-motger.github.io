<article class="page">
    <header class="page-head">
        <div class="page-icon"><i class="fas fa-hands-helping"></i></div>
        <div class="page-head-text">
            <h2>Service</h2>
            <p class="page-lead">Community and academic service activities.</p>
        </div>
    </header>
    <div id="service-sections"></div>
</article>

<style>
    .svc-row {
        padding: 9px 16px;
        align-items: center;
    }

    .svc-row .row-media {
        width: 30px;
        height: 30px;
        flex-basis: 30px;
        font-size: 12px;
    }

    .svc-row .row-title {
        font-weight: 500;
    }

    .svc-row .chip.small {
        white-space: normal;
        color: var(--text);
    }

    .svc-row .journal-chip {
        transition: border-color 0.15s ease, color 0.15s ease;
    }

    .svc-row .journal-chip:hover {
        border-color: var(--accent);
        color: var(--accent) !important;
        text-decoration: none !important;
    }

    .service-linkedin {
        color: #0a66c2 !important;
        margin-left: 0.25em;
    }

    .service-linkedin:hover {
        opacity: 0.75;
        text-decoration: none !important;
    }
</style>

<script>
(function() {
    function renderServiceSection(title, icon, rows) {
        return `
            <h3 class="section-label"><i class="fas ${icon}"></i>${title} <span class="count">· ${rows.length}</span></h3>
            <div class="card">${rows.map(row => row(icon)).join('')}</div>
        `;
    }

    // Each row is rendered with its section icon, a title line, an optional detail line and year badge
    function item(titleHtml, metaHtml, year) {
        return icon => `
            <div class="row-item svc-row">
                <div class="row-media"><i class="fas ${icon}"></i></div>
                <div class="row-body">
                    <div class="row-title">${titleHtml}</div>
                    ${metaHtml ? `<p class="row-meta">${metaHtml}</p>` : ''}
                </div>
                ${year ? `<div class="row-aside"><span class="badge">${year}</span></div>` : ''}
            </div>`;
    }

    function renderServiceData(data) {
        const container = document.getElementById('service-sections');
        if (!container) return;

        const getSortYear = (entry) => {
            if (typeof entry.year === 'number') return entry.year;
            if (typeof entry.year === 'string') {
                const parsed = parseInt(entry.year, 10);
                if (!Number.isNaN(parsed)) return parsed;
            }
            const match = (entry.event || '').match(/\b(19|20)\d{2}\b/g);
            return match ? parseInt(match[match.length - 1], 10) : 0;
        };

        const ocItems = [...data.organizingCommittee]
            .sort((a, b) => getSortYear(b) - getSortYear(a) || (a.event || '').localeCompare(b.event || ''))
            .map(entry => item(entry.role_html, entry.event, getSortYear(entry)));

        const conferenceWorkshopItems = [...(data.conferenceWorkshopService || [])]
            .sort((a, b) => (b.year || 0) - (a.year || 0) || `${a.name} ${a.acronym}`.localeCompare(`${b.name} ${b.acronym}`))
            .map(entry => {
                const tracks = (entry.tracks || []).join(' · ');
                const roles = (entry.roles || []).join(', ');
                return item(`<strong>${roles}</strong> · ${entry.acronym}`, `${entry.name}${tracks ? ` — ${tracks}` : ''}`, entry.year);
            });

        const journalItems = (data.journalEditorialRoles || [])
            .map(entry => item(entry.role_html, entry.journal))
            .concat(data.reviewerJournals.length ? [item('<strong>Reviewer</strong>', `<span class="chips">${data.reviewerJournals.map(journal => typeof journal === 'string' ? `<span class="chip small">${journal}</span>` : `<a class="chip small journal-chip" href="${journal.url}" target="_blank" rel="noopener">${journal.name}</a>`).join('')}</span>`)] : []);

        const phdStudentItems = (data.phdStudents || []).map(entry => {
            const programName = entry.program_url
                ? `<a href="${entry.program_url}" target="_blank" rel="noopener">${entry.program}</a>`
                : (entry.program || '');
            const linkedin = entry.url
                ? `<a href="${entry.url}" target="_blank" rel="noopener" class="service-linkedin" title="LinkedIn" aria-label="${entry.name} on LinkedIn"><i class="fab fa-linkedin"></i></a>`
                : '';
            const details = [entry.institution, programName].filter(Boolean).join(' · ');
            return item(`<strong>${entry.name}</strong>${linkedin}`, details);
        });

        const studentItems = data.students.map(entry => item(
            `<strong>${entry.name}</strong>`,
            `${entry.type}${entry.institution ? ` — ${entry.institution}` : ''}`,
            entry.academic_course));

        container.innerHTML = [
            renderServiceSection('Organizing Committee Membership', 'fa-sitemap', ocItems),
            renderServiceSection('Program Committee and Reviewer - Conferences and Workshops', 'fa-clipboard-check', conferenceWorkshopItems),
            renderServiceSection('Editorial Service and Reviewer - Journals', 'fa-newspaper', journalItems),
            renderServiceSection('PhD Students', 'fa-user-graduate', phdStudentItems),
            renderServiceSection('Undergraduate Students', 'fa-graduation-cap', studentItems),
        ].join('');
    }

    fetch(`data/service.json?v=${Date.now()}`, { cache: 'no-store' })
        .then(response => {
            if (!response.ok) throw new Error('Failed to load service data');
            return response.json();
        })
        .then(renderServiceData)
        .catch(error => {
            console.error('Error loading service data:', error);
            document.getElementById('service-sections').innerHTML = '<div class="empty">Error loading service data. Please try again later.</div>';
        });
})();
</script>
