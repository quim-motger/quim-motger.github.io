<article class="page">
    <header class="page-head">
        <div class="page-icon"><i class="fas fa-trophy"></i></div>
        <div class="page-head-text">
            <h2>Prizes</h2>
            <p class="page-lead">Awards and recognitions.</p>
        </div>
    </header>

    <div class="card" id="prizes-list"><div class="empty">Loading…</div></div>
</article>

<script>
(function() {
    function createPrizeRow(prize, year) {
        return `
            <div class="row-item">
                <div class="row-media gold"><i class="fas fa-trophy"></i></div>
                <div class="row-body">
                    <div class="row-title">${prize.title}</div>
                    <p class="row-meta">${prize.details}</p>
                </div>
                <div class="row-aside"><span class="badge">${year}</span></div>
            </div>
        `;
    }

    fetch('data/prizes.json')
        .then(response => {
            if (!response.ok) throw new Error('Failed to load prizes data');
            return response.json();
        })
        .then(years => {
            document.getElementById('prizes-list').innerHTML = years
                .flatMap(yearData => yearData.prizes.map(prize => createPrizeRow(prize, yearData.year)))
                .join('');
        })
        .catch(error => {
            console.error('Error loading prizes:', error);
            document.getElementById('prizes-list').innerHTML = '<div class="empty">Error loading prizes. Please try again later.</div>';
        });
})();
</script>
