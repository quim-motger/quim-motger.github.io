<article class="wrapper style2">
    <div class="container">
        <header style="text-align: left;">
            <h2>Publications</h2>
            <div id="publications-disclaimer" class="pub-disclaimer">
                <i class="fa-solid fa-circle-info"></i>
                <span id="publications-disclaimer-text">
                    This list is generated automatically from
                    <a href="https://dblp.org/pid/242/6477.html" target="_blank" rel="noopener"><img src="images/sources/dblp.png" alt="">dblp</a>
                    and
                    <a href="https://openalex.org/authors/A5060562561" target="_blank" rel="noopener"><img src="images/sources/openalex.png" alt="">OpenAlex</a>,
                    so some entries may be missing or show metadata inconsistencies.
                </span>
                <span class="pub-disclaimer-check">
                    Please check
                    <a href="https://dblp.org/pid/242/6477.html" target="_blank" rel="noopener" title="dblp"><img src="images/sources/dblp.png" alt="dblp"></a>
                    <a href="https://scholar.google.com/citations?user=_xi50f8AAAAJ&amp;hl=en" target="_blank" rel="noopener" title="Google Scholar"><i class="fa-brands fa-google-scholar" style="color: #4285f4;"></i></a>
                    <a href="https://orcid.org/0000-0002-4896-7515" target="_blank" rel="noopener" title="ORCID"><i class="fa-brands fa-orcid" style="color: #a6ce39;"></i></a>
                </span>
            </div>
            <div id="publication-filters" style="display: flex; gap: 1em; margin: 2em 0; width: 100%;">
                <!-- Filters will be added here dynamically -->
            </div>
        </header>
        <div class="row aln-center">
            <div id="publications-list"></div>
        </div>
    </div>
</article>

<!-- Add Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script>
// Only create the manager if it doesn't exist
if (typeof window.publicationsManager === 'undefined') {
    window.publicationsManager = (function() {
        let isInitialized = false;
        
        function getTypeInfo(type) {
            switch(type.toLowerCase()) {
                case 'article': 
                    return {
                        icon: 'fa-newspaper',
                        label: 'Journal',
                        color: '#3498db'
                    };
                case 'inproceedings': 
                    return {
                        icon: 'fa-users',
                        label: 'Conference',
                        color: '#27ae60'
                    };
                case 'book': 
                    return {
                        icon: 'fa-book',
                        label: 'Book',
                        color: '#8e44ad'
                    };
                case 'incollection': 
                    return {
                        icon: 'fa-book-open',
                        label: 'Book Chapter',
                        color: '#e67e22'
                    };
                case 'misc': 
                    return {
                        icon: 'fa-file-alt',
                        label: 'Pre-print',
                        color: '#c0392b'
                    };
                default: 
                    return {
                        icon: 'fa-file',
                        label: 'Other',
                        color: '#7f8c8d'
                    };
            }
        }

        function createFilterBoxes(entries) {
            const filtersContainer = document.getElementById('publication-filters');
            // Clear existing filters first
            filtersContainer.innerHTML = '';
            
            const typeCounts = {};
            
            // Count publications by type
            entries.forEach(entry => {
                typeCounts[entry.type] = (typeCounts[entry.type] || 0) + 1;
            });

            // Create filter boxes
            const numTypes = Object.keys(typeCounts).length;
            Object.entries(typeCounts).forEach(([type, count]) => {
                const typeInfo = getTypeInfo(type);
                const filterBox = document.createElement('div');
                filterBox.className = 'filter-box active';
                filterBox.dataset.type = type;
                filterBox.style.flex = `1 1 ${100/numTypes}%`;
                filterBox.innerHTML = `
                    <div class="filter-content" style="
                        background: white;
                        border-radius: 8px;
                        padding: 1.2em;
                        display: flex;
                        align-items: center;
                        gap: 0.8em;
                        cursor: pointer;
                        border: 1px solid rgba(58, 110, 165, 0.2);
                        transition: all 0.3s ease;
                        height: 100%;
                    ">
                        <div style="margin: 0 0.5em;">
                            <i class="fas ${typeInfo.icon}" style="font-size: 2.5em; color: ${typeInfo.color};"></i>
                        </div>
                        <div style="display: flex; flex-direction: column;">
                            <span style="font-size: 1.5em; font-weight: bold; color: ${typeInfo.color};">${count}</span>
                            <span style="font-size: 1.1em; color: #666;">${typeInfo.label}</span>
                        </div>
                    </div>
                `;
                
                filterBox.addEventListener('click', () => {
                    filterBox.classList.toggle('active');
                    filterPublications();
                });
                
                filtersContainer.appendChild(filterBox);
            });
        }

        function filterPublications() {
            const activeTypes = Array.from(document.querySelectorAll('.filter-box.active')).map(box => box.dataset.type);
            const publications = document.querySelectorAll('#publications-list .col-12');
            
            publications.forEach(pub => {
                const type = pub.dataset.type;
                if (activeTypes.includes(type)) {
                    pub.style.display = 'flex';
                } else {
                    pub.style.display = 'none';
                }
            });
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[ch]);
        }

        function updateDisclaimer(result) {
            const text = document.getElementById('publications-disclaimer-text');
            if (!text) return;
            if (result.fallback) {
                text.innerHTML = 'The live sources (dblp, OpenAlex) could not be reached, so an offline snapshot is shown and it may be outdated.';
            } else if (!result.sources.dblp || !result.sources.openalex) {
                text.innerHTML += ' <em>(' + (result.sources.dblp ? 'OpenAlex' : 'dblp') + ' is currently unreachable, so the list may be incomplete.)</em>';
            }
        }

        function renderEntry(entry) {
            const typeInfo = getTypeInfo(entry.type);
            const venue = entry.venue ? `${escapeHtml(entry.venue)}, ` : '';
            const citation = `${escapeHtml(entry.authors.join(' and '))}. <strong>${escapeHtml(entry.title)}</strong>. ${venue}${escapeHtml(entry.year)}.`;
            const link = entry.url;

            return `
                <div class="col-12" style="display: flex; align-items: stretch; margin-bottom: 1em;" data-type="${entry.type}">
                    <div style="width: 150px; display: flex; justify-content: center; align-items: center;">
                        <div style="width: 100px; height: 100%; background: white; border-radius: 8px; border: 1px solid rgba(58, 110, 165, 0.2); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; padding: 0;">
                            <i class="fas ${typeInfo.icon}" style="font-size: 2em; color: ${typeInfo.color}; margin: 0; padding: 0; line-height: 1;"></i>
                            <span style="font-size: 0.8em; color: ${typeInfo.color}; text-align: center; margin: 0; padding: 0; line-height: 1;">${typeInfo.label}</span>
                        </div>
                    </div>
                    ${link ? `
                        <a href="${escapeHtml(link)}" target="_blank" rel="noopener" style="text-decoration: none; flex: 1;">
                            <section class="box style1" style="flex: 1; text-align: left; padding: 1.5em; transition: all 0.3s ease; cursor: pointer; background: white;">
                                <div>
                                    <p style="margin: 0; color: #333; line-height: 1.5;">${citation}</p>
                                </div>
                            </section>
                        </a>
                    ` : `
                        <section class="box style1" style="flex: 1; text-align: left; padding: 1.5em;">
                            <div>
                                <p style="margin: 0; color: #333; line-height: 1.5;">${citation}</p>
                            </div>
                        </section>
                    `}
                </div>
            `;
        }

        function loadPublications() {
            // Reset initialization if the content is not loaded
            const container = document.getElementById('publications-list');
            if (!container || !container.innerHTML.trim()) {
                isInitialized = false;
            }

            if (isInitialized) return;
            isInitialized = true;

            if (!container) {
                console.error('Could not find publications-list element');
                return;
            }

            container.innerHTML = '<p class="pub-loading"><i class="fas fa-spinner fa-spin"></i> Loading publications…</p>';

            window.PublicationsData.load()
                .then(result => {
                    const entries = result.entries;
                    if (!entries || entries.length === 0) {
                        throw new Error('No publications found');
                    }

                    updateDisclaimer(result);

                    // Create filter boxes first
                    createFilterBoxes(entries);

                    // Group entries by year (entries arrive sorted by year, then type)
                    const entriesByYear = entries.reduce((acc, entry) => {
                        const year = entry.year || 'Unknown';
                        if (!acc[year]) acc[year] = [];
                        acc[year].push(entry);
                        return acc;
                    }, {});

                    // Sort years in descending order
                    const sortedYears = Object.keys(entriesByYear).sort((a, b) => b - a);

                    container.innerHTML = sortedYears.map(year => `
                        <div class="year-section" style="margin-bottom: 2em;">
                            <h3 style="
                                color: #666;
                                border-bottom: 1px solid #ddd;
                                padding-bottom: 0.5em;
                                margin-bottom: 1em;
                            ">${escapeHtml(year)}</h3>
                            ${entriesByYear[year].map(renderEntry).join('')}
                        </div>
                    `).join('');
                })
                .catch(error => {
                    console.error('Error loading publications:', error);
                    isInitialized = false;
                    container.innerHTML = '<p>Error loading publications. Please check <a href="https://dblp.org/pid/242/6477.html" target="_blank" rel="noopener">dblp</a> or <a href="https://scholar.google.com/citations?user=_xi50f8AAAAJ&amp;hl=en" target="_blank" rel="noopener">Google Scholar</a>.</p>';
                });
        }

        // Return the public interface
        return {
            loadPublications: loadPublications
        };
    })();
}

// Call the function immediately
window.publicationsManager.loadPublications();

// Add event listener for page navigation
document.addEventListener('DOMContentLoaded', function() {
    window.publicationsManager.loadPublications();
});
</script>

</style>
